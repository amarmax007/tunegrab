<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029"/>
      <stop offset="100%" stop-color="#111216"/>
    </linearGradient>

    <!-- Neon Yellow Glow -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ff6b"/>
      <stop offset="100%" stop-color="#d4e320"/>
    </linearGradient>

    <!-- Accent Terracotta -->
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff753a"/>
      <stop offset="100%" stop-color="#be5c2b"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f0fc54" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#tgBg)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8"/>

  <!-- Glowing Accent Border Ring -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="url(#neonGlow)" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Terracotta subtle accent ring -->
  <circle cx="390" cy="120" r="28" fill="url(#terraGrad)" opacity="0.9"/>
  <circle cx="390" cy="120" r="14" fill="#ffffff" opacity="0.3"/>

  <!-- Music Sound Waves & Beam (TuneGrab Icon) -->
  <g filter="url(#glowFilter)" transform="translate(112, 110)">
    <!-- Note Stem 1 -->
    <rect x="64" y="50" width="28" height="150" rx="14" fill="url(#neonGlow)"/>
    <!-- Note Head 1 -->
    <ellipse cx="50" cy="200" rx="44" ry="34" fill="url(#neonGlow)" transform="rotate(-20, 50, 200)"/>

    <!-- Note Stem 2 -->
    <rect x="196" y="20" width="28" height="150" rx="14" fill="url(#neonGlow)"/>
    <!-- Note Head 2 -->
    <ellipse cx="182" cy="170" rx="44" ry="34" fill="url(#neonGlow)" transform="rotate(-20, 182, 170)"/>

    <!-- High-Tension Top Beam -->
    <path d="M 64 64 C 110 50, 160 30, 224 20 L 224 54 C 160 64, 110 84, 64 98 Z" fill="url(#neonGlow)"/>

    <!-- Dynamic Download Arrow / Sonic Flash in center -->
    <path d="M 144 110 L 144 190 M 120 166 L 144 190 L 168 166" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
